# Render Blueprint — GitHub repo ildizida turadi. Render: New → Blueprint → shu repo.
# Maxfiy qiymatlar (sync: false) Render panelida qo'lda kiritiladi, gitga yozilmaydi.
services:
  - type: web
    name: grantora-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npx prisma generate --schema backend/prisma/schema.prisma && npx prisma db push --skip-generate --schema backend/prisma/schema.prisma && npm run prisma:seed -w backend && npm run build -w backend
    startCommand: node backend/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # Supabase: Transaction pooler (6543) + ?pgbouncer=true
      - key: DIRECT_URL
        sync: false          # Supabase: Session pooler (5432)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: WEB_ORIGIN
        sync: false          # masalan https://grantora-web.onrender.com
      # Admin va demo akkauntlar (seed har build'da: mavjudiga tegmaydi, yetishmaganini yaratadi)
      - key: ADMIN_EMAIL
        value: ortiqmirzayevalaylo826@gmail.com
      - key: ADMIN_PASSWORD
        sync: false          # admin paroli — O'ZINGIZ yozasiz (Render maxfiy maydoni)
      - key: SEED_DEMO_USERS
        value: "true"        # kurs/sinov uchun demo akkauntlar; haqiqiy ishga tushirishda "false" qiling
      - key: DEMO_PASSWORD
        sync: false          # demo akkauntlar paroli
      - key: COOKIE_SECURE
        value: "true"
      - key: MAIL_PROVIDER
        value: gmail         # Gmail ko'prigi (Apps Script); Render bepul rejasida SMTP portlari yopiq
      - key: MAIL_FROM
        sync: false          # "Grantora <sizning@gmail.com>"
      - key: EMAIL_RELAY_URL
        sync: false          # Apps Script Web app URL (.../exec)
      - key: EMAIL_RELAY_TOKEN
        sync: false          # gmail_relay.gs dagi TOKEN

  - type: web
    name: grantora-web
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build -w frontend
    startCommand: npm run start -w frontend
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_URL
        sync: false          # masalan https://grantora-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false          # masalan https://grantora-web.onrender.com
